plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dennis.masterroom'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dennis.masterroom.trial'
        minSdk 29
        targetSdk 34
        versionCode 12
        versionName '0.7.3-trial'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        // Test key, password public: lets each test APK install over the last one.
        trial {
            storeFile rootProject.file('signing/masterroom-test.jks')
            storePassword 'masterroomtest'
            keyAlias 'masterroom'
            keyPassword 'masterroomtest'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.trial
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.4.0'
    androidTestImplementation 'junit:junit:4.13.2'
}
