name: Master Room trial APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'design/studio-console-premium-v1', 'design/studio-console-v2-compact', 'feature/vocal-tune-android']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Engine checks
        run: |
          mkdir -p build/host
          javac -nowarn -encoding UTF-8 -d build/host $(find app/src/main/java/com/dennis/masterroom/engine app/src/main/java/de -name '*.java') tools/check/com/dennis/masterroom/engine/EngineChecks.java
          java -Xmx3g -cp build/host com.dennis.masterroom.engine.EngineChecks
          # A 3:44 song must master inside a tight heap, at both ends of the loudness range.
          javac -nowarn -cp build/host -d build/host tools/MemoryCheck.java
          java -Xmx300m -Xmn8m -XX:+UseSerialGC -cp build/host MemoryCheck -14 | tee memory.txt
          java -Xmx300m -Xmn8m -XX:+UseSerialGC -cp build/host MemoryCheck -10 | tee -a memory.txt
          java -Xmx300m -Xmn8m -XX:+UseSerialGC -cp build/host MemoryCheck -14 stems | tee -a memory.txt
          java -Xmx300m -Xmn8m -XX:+UseSerialGC -cp build/host MemoryCheck -14 tune | tee -a memory.txt
          test "$(grep -c MEMORY_CHECK_PASS memory.txt)" = 4
          # Vocal Tune: detuned singing is pulled in, in-tune singing, harmonies and full mixes are left alone.
          javac -nowarn -cp build/host -d build/host desktop/check/com/dennis/masterroom/engine/VocalTuneProbe.java desktop/check/VocalTuneCheck.java
          java -Xmx2g -cp build/host VocalTuneCheck
      - name: Fetch fonts
        run: bash tools/fetch_fonts.sh
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MasterRoom-trial-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish trial download
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)
          TAG="android-v$VERSION"
          cp app/build/outputs/apk/debug/*.apk "MasterRoom-$VERSION.apk"
          NOTES="Master Room for Android $VERSION (trial, test-signed). Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Download the .apk below on the phone and open it to install."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "MasterRoom-$VERSION.apk" --clobber
            gh release edit "$TAG" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" "MasterRoom-$VERSION.apk" --title "Master Room Android $VERSION" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
