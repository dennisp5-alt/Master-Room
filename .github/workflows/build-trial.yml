name: Master Room trial APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'design/studio-console-premium-v1', 'design/studio-console-v2-compact']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Engine checks
        run: |
          mkdir -p build/host
          javac -nowarn -encoding UTF-8 -d build/host $(find app/src/main/java/com/dennis/masterroom/engine app/src/main/java/de -name '*.java') tools/check/com/dennis/masterroom/engine/EngineChecks.java
          java -Xmx3g -cp build/host com.dennis.masterroom.engine.EngineChecks
          # A 3:44 song must master inside a tight heap, at both ends of the loudness range.
          javac -nowarn -cp build/host -d build/host tools/MemoryCheck.java
          java -Xmx300m -Xmn8m -XX:+UseSerialGC -cp build/host MemoryCheck -14 | tee memory.txt
          java -Xmx300m -Xmn8m -XX:+UseSerialGC -cp build/host MemoryCheck -10 | tee -a memory.txt
          test "$(grep -c MEMORY_CHECK_PASS memory.txt)" = 2
      - name: Fetch fonts
        run: bash tools/fetch_fonts.sh
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MasterRoom-trial-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
